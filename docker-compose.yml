services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_api_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - todo_network

  nginx:
    image: nginx:alpine
    container_name: todo_api_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - todo_network

  mysql:
    image: mysql:8.0
    container_name: todo_api_mysql
    environment:
      MYSQL_DATABASE: todo_api
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todo_network

  redis:
    image: redis:7-alpine
    container_name: todo_api_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - todo_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_api_queue
    working_dir: /var/www
    command: php artisan queue:work redis --verbose --tries=3
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - todo_network

volumes:
  mysql_data:
  redis_data:

networks:
  todo_network:
    driver: bridge